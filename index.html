<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset id="categories">
        <legend>Categorias</legend>
        <div class="category">
            <input type="radio" name="opcao" id="todos" checked>
            <label for="todos">todos</label>
        </div>
    </fieldset>
    <fieldset id="providers">
        <legend>Fornecedores</legend>
    </fieldset>
    <div style="display: flex; gap:20px; padding: 20px; flex-direction: row; align-items: center;">
        Busca por preço em R$<input type="text" name="pesquisa" id="search" placeholder="999.99" onkeyup="clickSearchBtn(event)">
        <button class="btn" id="searchBtn">pesquisar</button>
    </div>
    <div id="tableDiv" style="width:100%; overflow-x: auto;">
    <table id="productsTable">
        <thead>
            <tr class="FirstLine">
                <td>ID</td>
                <td>NOME</td>
                <td>PREÇO</td>
                <td>ESTOQUE</td>
                <td>CATEGORIA</td>
                <td>FORNECEDOR</td>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot></tfoot>
    </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
